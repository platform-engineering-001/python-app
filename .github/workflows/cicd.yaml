name: python-app-cicd-pipeline
on: 
    push: 
        branches: 
          - main
        paths: 
          - src/** 
    workflow_dispatch: 
permissions: 
    contents: write 
jobs: 
    setting-runner: 
      runs-on: ubuntu-latest 
      steps: 
        - uses: actions/checkout@v4 
      # Step 1 — Configure AWS credentials
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{secrets.aws_access_key_id}}
            aws-secret-access-key: ${{secrets.aws_access_key}}
            aws-region: ${{secrets.aws_region }}


        - name: Update kube-config for eks 
          run: | 
            aws eks update-kubeconfig --name ${{secrets.cluster_name}} --region ${{secrets.aws_region}}

        - name: verify cluster connection 
          run: kubectl get nodes 
          
        - name: Apply runner deployment 
          run: |
              kubectl apply -f runner-deployment.yml 

        - name: check runner status 
          run: | 
            kubectl get runners -n actions-runner-system 
            kubectl get pods -n actions-runner-system 
          
    CI: 
        needs: setting-runner 
        outputs: 
          commit_id : ${{ steps.calc_sha.outputs.short_sha }}
        runs-on: self-hosted
        steps: 
            - uses: actions/checkout@v4
            - name: Calculate short SHA
              shell: bash 
              run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              id: calc_sha
            
            
            - name: Login to Dockerhub 
              uses: docker/login-action@v4
              with: 
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                driver: docker


            - name: Build and push
              uses: docker/build-push-action@v6
              with: 
                push: true 
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-app:${{ steps.calc_sha.outputs.short_sha }}
            
                
            - name: Update image tag in values.yaml of helm
              shell: bash
              run: |
                FILE="charts/python-app/values.yaml"
                echo "Before:"
                grep "tag:" "$FILE" || true
                sed -i "s|^\(\s*tag:\s*\).*|\1\"${{ steps.calc_sha.outputs.short_sha }}\"|" "$FILE"
                echo "After:"
                grep "tag:" "$FILE" || true
                git config user.name "github-actions"
                git config user.email "github-actions@github.com"
                git add "$FILE"
                if git diff --staged --quiet; then
                  echo "No changes to commit"
                else
                  git commit -m "ci: update image tag to ${{ steps.calc_sha.outputs.short_sha }}"
                  git push
                fi


    CD: 
      needs: CI 
      runs-on: self-hosted 
      env : 
          commit_id: ${{needs.CI.outputs.commit_id}}
      steps : 
           
          - name: Install Argo CD CLI
            run: |
              ARGOCD_VERSION=v2.13.2
              mkdir -p "$HOME/bin"
              curl -fsSL -o "$HOME/bin/argocd" \
                "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
              chmod +x "$HOME/bin/argocd"
              echo "$HOME/bin" >> "$GITHUB_PATH"
              "$HOME/bin/argocd" version --client
          - name: Argo CD sync
            shell: bash
            env:
              ARGOCD_PASSWORD: ${{ secrets.ARGOCD_PASSWORD }}
            run: |
              argocd login argocd-server.argocd \
                --plaintext --grpc-web \
                --username admin \
                --password "$ARGOCD_PASSWORD"

              argocd app sync python-app
              argocd app wait python-app --health --timeout 300
