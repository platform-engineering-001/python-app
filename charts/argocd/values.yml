redis-ha:
  enabled: false

controller:
  replicas: 1


repoServer:
  autoscaling:
    enabled: true
    minReplicas: 1

applicationSet:
  replicas: 1

global:
  domain: argocd.test.com

certificate:
  enabled: true

configs:               # this is required if you want to run using local dns argocd.test.com 
  params:
    server.insecure: true

  
server:
  replicas: 1 
  ingress:
    annotations: 
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    enabled: true
    ingressClassName: nginx
    tls: true