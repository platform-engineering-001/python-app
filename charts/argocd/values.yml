redis-ha:
  enabled: false

controller:
  replicas: 1


repoServer:
  autoscaling:
    enabled: true
    minReplicas: 1

applicationSet:
  replicas: 1

global:
  domain: argocd.test.com

certificate:
  enabled: true

configs:               # this is required if you want to run using local dns argocd.test.com 
  params:
    server.insecure: true

  
server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: alb
    tls: false
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/group.name: platform-shared-alb
