kind: Deployment 
apiVersion: apps/v1 
metadata: 
  name: flask-dep
  namespace: dev 
spec: 
  replicas: 2 
  selector : 
    matchLabels:
      app: flask-app 
  template: 
    metadata: 
      labels: 
        app: flask-app 
    spec: 
      containers: 
        - name: flask-pod 
          image: himanshu1236/python-app:v1
          imagePullPolicy: IfNotPresent 
          ports: 
            - containerPort: 5000 
          resources: 
            requests: 
              cpu: 200m
              memory: 300Mi 
            limits: 
              cpu: 300m 
              memory: 500Mi 

          

--- 
kind: Service 
apiVersion: v1 
metadata: 
  name: flask-svc 
  namespace: dev 
spec: 

  selector: 
    app: flask-app 
  ports: 
    - port: 80 
      targetPort: 5000